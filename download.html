<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Backup</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f8fafc;
      margin: 0;
    }
    .container {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    button {
      background: #111827;
      color: white;
      border: none;
      padding: 16px 32px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      margin: 10px 0;
    }
    button:hover { background: #1f2937; }
    .file-info { color: #6b7280; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📦 ShopVerse Backup</h1>
    <p>Download the complete project backup</p>
    <button onclick="downloadBackup()">⬇️ Download ZIP</button>
    <p class="file-info">File will be saved to your device</p>
  </div>
  <script>
    function downloadBackup() {
      // List all zip files in the directory
      fetch('/list-backups')
        .then(res => res.json())
        .then(files => {
          if (files.length === 0) {
            alert('No backup files found. Please run ./package.sh first.');
            return;
          }
          const latest = files[files.length - 1];
          window.location.href = '/' + latest;
        })
        .catch(() => {
          alert('Please run ./package.sh first to create a backup.');
        });
    }
  </script>
</body>
</html>
